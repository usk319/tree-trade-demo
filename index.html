<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>織杜 - 森林境界・立木取引統合システム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --green: #00B900; --web3: #8247E5; --red: #ff4757; --blue: #007bff; --bg: #f8f9fa; }
        body { margin: 0; font-family: "Hiragino Mincho ProN", serif; background: var(--bg); color: #2d3436; overflow: hidden; height: 100vh; width: 100vw; }
        
        /* 画面表示制御 */
        .view { display: none; height: 100vh; flex-direction: column; overflow-y: auto; background: #fff; }
        .view.active { display: flex !important; } 
        
        /* 共通UI */
        .mode-tag { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: bold; margin-bottom: 10px; color: #fff; }
        .input-field { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 12px; font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 14px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn:active { opacity: 0.6; }
        .btn-primary { background: var(--green); color: white; }
        .btn-web3 { background: var(--web3); color: white; }

        /* 地図レイアウト */
        #map-area { flex: 1; position: relative; width: 100%; min-height: 40vh; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #detail-area { background: #fff; border-top: 5px solid var(--green); display: none; padding: 20px; overflow-y: auto; height: 60vh; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
        body.mode-split #detail-area { display: block; }
        body.mode-split #map-area { flex: 0.4; }

        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
        .photo-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; border: 3px solid #eee; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }

        /* 署名キャンバス */
        .sig-container { background: #f1f2f6; padding: 15px; border-radius: 15px; margin-bottom: 10px; }
        .sig-box { border: 2px dashed #a4b0be; background: #fff; border-radius: 10px; touch-action: none; width: 100%; height: 180px; }

        /* プログレス・オーバーレイ */
        #pdf-progress { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 10000; flex-direction: column; color: #fff; text-align: center; }
        .loader { width: 50px; height: 50px; border: 5px solid var(--web3); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status-text { font-size: 14px; color: #aaa; margin-top: 15px; font-family: monospace; letter-spacing: 1px; }
    </style>
</head>
<body>

<div id="pdf-progress">
    <div class="loader"></div>
    <div style="font-weight:bold; letter-spacing:3px; color:var(--web3); font-size:20px;">ORITO CORE</div>
    <div id="status-text">SYSTEM READY...</div>
</div>

<div id="home-view" class="view active">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center;">
        <h1 style="color:var(--green); font-size:32px; margin:0;">織杜 ORITO</h1>
        <p style="color:#666; font-size:14px; margin-bottom:60px;">森林境界・立木取引 DXプラットフォーム</p>
        
        <button class="btn btn-primary" style="height:100px;" onclick="selectMode('boundary')">
            📍 境界確定合意<br><span style="font-size:11px; font-weight:normal;">隣接地権者との境界確認・署名</span>
        </button>
        
        <button class="btn btn-web3" style="height:100px;" onclick="selectMode('timber')">
            🌲 立木売買契約<br><span style="font-size:11px; font-weight:normal;">立木の売却・スマートコントラクト</span>
        </button>
    </div>
</div>

<div id="entry-view" class="view">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px;">
        <div id="entry-tag" class="mode-tag"></div>
        <h2 style="margin-bottom:30px;">招待コードを入力</h2>
        <input type="text" id="invite-input" class="input-field" style="text-align:center; font-size:26px; letter-spacing:6px;" placeholder="ADMIN001">
        <button class="btn btn-primary" id="entry-next-btn" onclick="verifyCode()">調査台帳を照会</button>
        <button class="btn" style="background:#f1f2f6; margin-top:20px;" onclick="location.reload()">最初に戻る</button>
    </div>
</div>

<div id="kyc-view" class="view" style="padding:30px;">
    <h2>当事者確認</h2>
    <p id="role-label" style="font-weight:bold; color:var(--web3); padding:10px; background:#f0ebff; border-radius:8px;"></p>
    <input type="text" id="current-address" class="input-field" placeholder="現住所を入力してください">
    <button class="btn btn-primary" onclick="changeView('map-view')">地図を表示</button>
</div>

<div id="map-view" class="view">
    <div id="map-area"><div id="map"></div></div>
    <div id="detail-area">
        <h3 id="parcel-title">物件情報</h3>
        <p id="parcel-info" style="font-size:14px; color:#666; margin-bottom:15px;"></p>
        <div id="photo-list" class="photo-grid"></div>
        <button class="btn btn-primary" onclick="changeView('agree-view')">署名ステップへ</button>
        <button class="btn" style="background:#f8f9fa;" onclick="closeDetail()">✕ 閉じる</button>
    </div>
</div>

<div id="timber-view" class="view" style="padding:30px;">
    <div class="mode-tag" style="background:var(--web3);">立木売買</div>
    <h2>売買条件の確認</h2>
    <div style="background:#f8f9fa; padding:15px; border-radius:12px; margin-bottom:20px; font-size:14px;">
        <p>対象地番：<span id="t-parcel"></span></p>
        <p>面積：<span id="t-area"></span> ha</p>
    </div>
    <input type="number" id="trade-price" class="input-field" placeholder="売買代金を入力">
    <input type="date" id="logging-deadline" class="input-field">
    <button class="btn btn-web3" onclick="changeView('agree-view')">契約署名へ</button>
</div>

<div id="agree-view" class="view" style="padding:30px;">
    <h2>最終署名</h2>
    <div class="sig-container">
        <canvas id="sig-canvas" class="sig-box"></canvas>
    </div>
    <button class="btn btn-primary" id="final-btn" onclick="finalizeProcess()">確定して保存</button>
    <button class="btn" style="background:#f1f2f6;" onclick="clearSig()">書き直し</button>
</div>

<div id="pdf-overlay" style="position:fixed; top:0; left:-20000px; width:210mm;"><div id="pdf-template"></div></div>

<script>
    /* ----------------------------------------------------------------
       1. 変数宣言（ここを一度だけに修正済み）
       ---------------------------------------------------------------- */
    const S_URL = 'https://uggpclqqyaailuadgzxv.supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnZ3BjbHFxeWFhaWx1YWRnenh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MzE0NTgsImV4cCI6MjA5MDEwNzQ1OH0.jY5jJuJUgwbIZm8y-jJvEH27eAP9m9semR3MbLxVxGo';
    const supabase = window.supabase.createClient(S_URL, S_KEY);

    let targetData = null;
    let mapInstance = null;
    let sigCtx = null;
    let currentMode = 'boundary';
    let isOwner = true;

    /* ----------------------------------------------------------------
       2. 基本関数
       ---------------------------------------------------------------- */
    function updateStatus(text) { document.getElementById('status-text').innerText = text; }

    function changeView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        const next = document.getElementById(id);
        if (next) {
            next.classList.add('active');
            if (id === 'map-view') setTimeout(initMap, 300);
            if (id === 'agree-view') setTimeout(initCanvas, 500);
        }
    }

    function selectMode(mode) {
        currentMode = mode;
        const tag = document.getElementById('entry-tag');
        const btn = document.getElementById('entry-next-btn');
        tag.innerText = mode === 'boundary' ? '境界確定モード' : '立木取引モード';
        tag.style.background = mode === 'boundary' ? 'var(--green)' : 'var(--web3)';
        btn.style.background = mode === 'boundary' ? 'var(--green)' : 'var(--web3)';
        changeView('entry-view');
    }

    /* ----------------------------------------------------------------
       3. 業務ロジック
       ---------------------------------------------------------------- */
    async function verifyCode() {
        const code = document.getElementById('invite-input').value.toUpperCase().trim();
        if(!code) return alert("コードを入力してください");

        const { data, error } = await supabase.from('forest_plots').select('*').eq('invitation_code', code).single();
        if (!data) return alert("無効な招待コードです。");

        targetData = data;
        if (currentMode === 'timber') {
            document.getElementById('t-parcel').innerText = data.parcel_number;
            document.getElementById('t-area').innerText = data.area_ha;
            document.getElementById('final-btn').style.background = 'var(--web3)';
            changeView('timber-view');
        } else {
            isOwner = !data.sig_a_done;
            document.getElementById('role-label').innerText = isOwner ? "役割：土地所有者（甲）" : "役割：隣接土地所有者（乙）";
            document.getElementById('current-address').value = isOwner ? (data.owner_address || "") : (data.adjacent_address || "");
            changeView('kyc-view');
        }
    }

    function initMap() {
        if (mapInstance) return;
        mapInstance = new maplibregl.Map({
            container: 'map',
            style: { "version": 8, "sources": { "gsi": { "type": "raster", "tiles": ["https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"], "tileSize": 256 } }, "layers": [{ "id": "gsi", "type": "raster", "source": "gsi" }] },
            center: [131.39, 31.99], zoom: 16, preserveDrawingBuffer: true
        });
        mapInstance.on('load', async () => {
            const { data } = await supabase.rpc('get_forest_geojson');
            const filtered = data.features.filter(f => f.properties.invitation_code === targetData.invitation_code);
            mapInstance.addSource('plot-src', { 'type': 'geojson', 'data': { type: "FeatureCollection", features: filtered } });
            mapInstance.addLayer({ 'id': 'fill', 'type': 'fill', 'source': 'plot-src', 'paint': { 'fill-opacity': 0.4, 'fill-color': '#00B900' } });
            if (filtered[0]) {
                const bounds = new maplibregl.LngLatBounds();
                const coords = filtered[0].geometry.type === 'MultiPolygon' ? filtered[0].geometry.coordinates[0][0] : filtered[0].geometry.coordinates[0];
                coords.forEach(c => bounds.extend(c));
                mapInstance.fitBounds(bounds, { padding: 50 });
            }
            mapInstance.on('click', 'fill', () => showDetail());
        });
    }

    function showDetail() {
        document.getElementById('parcel-title').innerText = targetData.parcel_number;
        document.getElementById('parcel-info').innerText = `${targetData.area_ha}ha / ${targetData.tree_species}`;
        const urls = getUrls(targetData.evidence_photo_url);
        document.getElementById('photo-list').innerHTML = urls.map(u => `<div class="photo-item"><img src="${u}"></div>`).join('');
        document.body.classList.add('mode-split');
        setTimeout(() => mapInstance.resize(), 300);
    }

    function closeDetail() { document.body.classList.remove('mode-split'); setTimeout(() => mapInstance.resize(), 300); }

    function initCanvas() {
        const cvs = document.getElementById('sig-canvas'); cvs.width = cvs.offsetWidth; cvs.height = cvs.offsetHeight;
        sigCtx = cvs.getContext('2d'); let drawing = false;
        const getP = (e) => { const r = cvs.getBoundingClientRect(); const cx = e.touches ? e.touches[0].clientX : e.clientX; const cy = e.touches ? e.touches[0].clientY : e.clientY; return { x: cx - r.left, y: cy - r.top }; };
        cvs.addEventListener('touchstart', (e) => { drawing = true; sigCtx.beginPath(); sigCtx.moveTo(getP(e).x, getP(e).y); e.preventDefault(); });
        cvs.addEventListener('touchmove', (e) => { if(!drawing) return; sigCtx.lineTo(getP(e).x, getP(e).y); sigCtx.stroke(); e.preventDefault(); });
        window.addEventListener('touchend', () => drawing = false);
        sigCtx.lineWidth = 2; sigCtx.strokeStyle = "#000";
    }
    function clearSig() { sigCtx.clearRect(0,0,1000,1000); }

    async function finalizeProcess() {
        const cvs = document.getElementById('sig-canvas');
        const ctx = cvs.getContext('2d');
        const pixels = ctx.getImageData(0, 0, cvs.width, cvs.height).data;
        if(!Array.from(pixels).some(p => p !== 0)) return alert("署名を入力してください");

        document.getElementById('pdf-progress').style.display = 'flex';
        updateStatus("署名を保存中...");
        const sigData = cvs.toDataURL("image/png");

        try {
            if (currentMode === 'boundary') {
                const updates = isOwner 
                    ? { sig_a_done: true, sig_a_data: sigData, owner_address: document.getElementById('current-address').value }
                    : { sig_b_done: true, sig_b_data: sigData, adjacent_address: document.getElementById('current-address').value, is_agreed: true };
                await supabase.from('forest_plots').update(updates).eq('id', targetData.id);
                alert("手続きが完了しました。");
                location.reload();
            } else {
                alert("立木売買契約を記録しました。");
                location.reload();
            }
        } catch (e) {
            alert("エラーが発生しました。");
            document.getElementById('pdf-progress').style.display = 'none';
        }
    }

    function getUrls(d) {
        if (!d) return [];
        if (Array.isArray(d)) return d;
        try { return JSON.parse(d); } catch(e) { return []; }
    }

    // システム起動
    liff.init({ liffId: "2009576392-CvuNETRQ" }).catch(e => console.log(e));
</script>
</body>
</html>
