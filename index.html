<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>織杜 - 森林境界・立木取引統合システム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --green: #00B900; --web3: #8247E5; --red: #ff4757; --blue: #007bff; --bg: #f8f9fa; }
        body { margin: 0; font-family: "Hiragino Mincho ProN", serif; background: var(--bg); color: #2d3436; overflow: hidden; height: 100vh; width: 100vw; }
        .view { display: none; height: 100vh; flex-direction: column; overflow-y: auto; background: #fff; }
        .view.active { display: flex !important; } 
        .input-field { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 12px; font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 14px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-primary { background: var(--green); color: white; }
        .btn-web3 { background: var(--web3); color: white; }
        #map-area { flex: 1; position: relative; width: 100%; min-height: 40vh; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #detail-area { background: #fff; border-top: 5px solid var(--green); display: none; padding: 20px; overflow-y: auto; height: 60vh; border-radius: 20px 20px 0 0; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); }
        body.mode-split #detail-area { display: block; }
        body.mode-split #map-area { flex: 0.4; }
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
        .photo-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; border: 3px solid #eee; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .sig-box { border: 2px dashed #a4b0be; background: #fff; border-radius: 10px; touch-action: none; width: 100%; height: 180px; }
        #pdf-progress { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 10000; flex-direction: column; color: #fff; text-align: center; }
        .loader { width: 50px; height: 50px; border: 5px solid var(--web3); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status-text { font-size: 14px; color: #aaa; margin-top: 15px; font-family: monospace; }
    </style>
</head>
<body>

<div id="pdf-progress">
    <div class="loader"></div>
    <div style="font-weight:bold; letter-spacing:3px; color:var(--web3); font-size:20px;">ORITO CORE</div>
    <div id="status-text">INITIALIZING...</div>
</div>

<div id="home-view" class="view active">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px; text-align:center;">
        <h1 style="color:var(--green); font-size:32px; margin:0;">織杜 ORITO</h1>
        <p style="color:#666; font-size:14px; margin-bottom:60px;">森林境界・立木取引 DXプラットフォーム</p>
        <button class="btn btn-primary" style="height:100px;" id="btn-boundary">📍 境界確定合意</button>
        <button class="btn btn-web3" style="height:100px;" id="btn-timber">🌲 立木売買契約</button>
    </div>
</div>

<div id="entry-view" class="view">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px;">
        <div id="entry-tag" style="display:inline-block; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:bold; margin-bottom:10px; color:#fff;"></div>
        <h2 style="margin-bottom:30px;">招待コードを入力</h2>
        <input type="text" id="invite-input" class="input-field" style="text-align:center; font-size:26px; letter-spacing:6px;" placeholder="ADMIN001">
        <button class="btn btn-primary" id="entry-next-btn">調査台帳を照会</button>
        <button class="btn" style="background:#f1f2f6; margin-top:20px;" id="btn-back">戻る</button>
    </div>
</div>

<div id="kyc-view" class="view" style="padding:30px;">
    <h2>当事者確認</h2>
    <p id="role-label" style="font-weight:bold; color:var(--web3); padding:10px; background:#f0ebff; border-radius:8px;"></p>
    <input type="text" id="current-address" class="input-field" placeholder="現住所を入力してください">
    <button class="btn btn-primary" id="btn-show-map">地図を表示</button>
</div>

<div id="map-view" class="view">
    <div id="map-area"><div id="map"></div></div>
    <div id="detail-area">
        <h3 id="parcel-title">物件情報</h3>
        <p id="parcel-info" style="font-size:14px; color:#666; margin-bottom:15px;"></p>
        <div id="photo-list" class="photo-grid"></div>
        <button class="btn btn-primary" id="btn-to-agree">署名ステップへ</button>
        <button class="btn" style="background:#f8f9fa;" id="btn-close-detail">✕ 地図に戻る</button>
    </div>
</div>

<div id="timber-view" class="view" style="padding:30px;">
    <h2>売買条件の確認</h2>
    <div style="background:#f8f9fa; padding:15px; border-radius:12px; margin-bottom:20px;">
        <p><strong>対象地番：</strong><span id="t-parcel"></span></p>
        <p><strong>面積：</strong><span id="t-area"></span> ha</p>
    </div>
    <input type="number" id="trade-price" class="input-field" placeholder="売買代金を入力">
    <input type="date" id="logging-deadline" class="input-field">
    <button class="btn btn-web3" id="btn-timber-agree">契約署名へ</button>
</div>

<div id="agree-view" class="view" style="padding:30px;">
    <h2>最終署名</h2>
    <canvas id="sig-canvas" class="sig-box"></canvas>
    <button class="btn btn-primary" id="final-btn">確定して保存</button>
    <button class="btn" style="background:#f1f2f6;" id="btn-clear-sig">書き直し</button>
</div>

<div id="pdf-overlay" style="position:fixed; top:0; left:-20000px; width:210mm;"><div id="pdf-template"></div></div>

<script>
(function() {
    'use strict';

    // --- 1. Supabase初期化（変数名を "db" に変更して window.supabase との衝突を回避）---
    var S_URL = 'https://uggpclqqyaailuadgzxv.supabase.co';
    var S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnZ3BjbHFxeWFhaWx1YWRnenh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MzE0NTgsImV4cCI6MjA5MDEwNzQ1OH0.jY5jJuJUgwbIZm8y-jJvEH27eAP9m9semR3MbLxVxGo';
    var db = window.supabase.createClient(S_URL, S_KEY);

    var targetData = null;
    var mapInstance = null;
    var sigCtx = null;
    var currentMode = 'boundary';
    var isOwner = true;

    // --- 2. ユーティリティ ---
    function updateStatus(text) {
        var el = document.getElementById('status-text');
        if (el) el.innerText = text;
    }

    function changeView(id) {
        document.querySelectorAll('.view').forEach(function(v) { v.classList.remove('active'); });
        var next = document.getElementById(id);
        if (next) {
            next.classList.add('active');
            if (id === 'map-view') setTimeout(initMap, 300);
            if (id === 'agree-view') setTimeout(initCanvas, 500);
        }
    }

    // --- 3. モード選択 ---
    function selectMode(mode) {
        currentMode = mode;
        var tag = document.getElementById('entry-tag');
        tag.innerText = mode === 'boundary' ? '境界確定モード' : '立木取引モード';
        tag.style.background = mode === 'boundary' ? 'var(--green)' : 'var(--web3)';
        changeView('entry-view');
    }

    // --- 4. 招待コード照会 ---
    async function verifyCode() {
        var code = document.getElementById('invite-input').value.toUpperCase().trim();
        var result = await db.from('forest_plots').select('*').eq('invitation_code', code).single();
        var data = result.data;
        var error = result.error;
        if (error || !data) {
            alert("無効なコードです。");
            return;
        }
        targetData = data;
        if (currentMode === 'timber') {
            document.getElementById('t-parcel').innerText = data.parcel_number;
            document.getElementById('t-area').innerText = data.area_ha;
            changeView('timber-view');
        } else {
            isOwner = !data.sig_a_done;
            document.getElementById('role-label').innerText = isOwner ? "役割：土地所有者（甲）" : "役割：隣接所有者（乙）";
            changeView('kyc-view');
        }
    }

    // --- 5. 地図初期化 ---
    function initMap() {
        if (mapInstance) return;
        mapInstance = new maplibregl.Map({
            container: 'map',
            style: {
                "version": 8,
                "sources": {
                    "gsi": {
                        "type": "raster",
                        "tiles": ["https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"],
                        "tileSize": 256
                    }
                },
                "layers": [{ "id": "gsi", "type": "raster", "source": "gsi" }]
            },
            center: [131.39, 31.99],
            zoom: 16,
            preserveDrawingBuffer: true
        });

        mapInstance.on('load', async function() {
            var result = await db.rpc('get_forest_geojson');
            var data = result.data;
            if (!data || !data.features) return;
            var filtered = data.features.filter(function(f) {
                return f.properties.invitation_code === targetData.invitation_code;
            });
            mapInstance.addSource('plot-src', {
                'type': 'geojson',
                'data': { type: "FeatureCollection", features: filtered }
            });
            mapInstance.addLayer({
                'id': 'fill',
                'type': 'fill',
                'source': 'plot-src',
                'paint': { 'fill-opacity': 0.4, 'fill-color': '#00B900' }
            });
            if (filtered[0]) {
                var bounds = new maplibregl.LngLatBounds();
                var coords = filtered[0].geometry.type === 'MultiPolygon'
                    ? filtered[0].geometry.coordinates[0][0]
                    : filtered[0].geometry.coordinates[0];
                coords.forEach(function(c) { bounds.extend(c); });
                mapInstance.fitBounds(bounds, { padding: 50 });
            }
            mapInstance.on('click', 'fill', function() {
                document.getElementById('parcel-title').innerText = targetData.parcel_number;
                document.body.classList.add('mode-split');
                setTimeout(function() { mapInstance.resize(); }, 300);
            });
        });
    }

    // --- 6. 署名キャンバス初期化 ---
    function initCanvas() {
        var cvs = document.getElementById('sig-canvas');
        cvs.width = cvs.offsetWidth;
        cvs.height = cvs.offsetHeight;
        sigCtx = cvs.getContext('2d');
        var drawing = false;

        function getP(e) {
            var r = cvs.getBoundingClientRect();
            return {
                x: (e.touches ? e.touches[0].clientX : e.clientX) - r.left,
                y: (e.touches ? e.touches[0].clientY : e.clientY) - r.top
            };
        }

        cvs.addEventListener('touchstart', function(e) {
            drawing = true;
            sigCtx.beginPath();
            sigCtx.moveTo(getP(e).x, getP(e).y);
            e.preventDefault();
        }, { passive: false });

        cvs.addEventListener('touchmove', function(e) {
            if (!drawing) return;
            sigCtx.lineTo(getP(e).x, getP(e).y);
            sigCtx.stroke();
            e.preventDefault();
        }, { passive: false });

        cvs.addEventListener('mousedown', function(e) {
            drawing = true;
            sigCtx.beginPath();
            sigCtx.moveTo(getP(e).x, getP(e).y);
        });

        cvs.addEventListener('mousemove', function(e) {
            if (!drawing) return;
            sigCtx.lineTo(getP(e).x, getP(e).y);
            sigCtx.stroke();
        });

        window.addEventListener('touchend', function() { drawing = false; });
        window.addEventListener('mouseup', function() { drawing = false; });

        sigCtx.lineWidth = 2;
        sigCtx.strokeStyle = "#000";
    }

    // --- 7. 確定処理 ---
    async function finalizeProcess() {
        document.getElementById('pdf-progress').style.display = 'flex';
        updateStatus("署名を保存中...");
        var sigData = document.getElementById('sig-canvas').toDataURL("image/png");
        try {
            var updates;
            if (currentMode === 'boundary') {
                if (isOwner) {
                    updates = {
                        sig_a_done: true,
                        sig_a_data: sigData,
                        owner_address: document.getElementById('current-address').value
                    };
                } else {
                    updates = {
                        sig_b_done: true,
                        sig_b_data: sigData,
                        adjacent_address: document.getElementById('current-address').value,
                        is_agreed: true
                    };
                }
            } else {
                updates = { sig_a_done: true, sig_a_data: sigData };
            }
            await db.from('forest_plots').update(updates).eq('id', targetData.id);
            alert("ブロックチェーンに記録完了しました。");
            location.reload();
        } catch (e) {
            alert("保存に失敗しました。");
            document.getElementById('pdf-progress').style.display = 'none';
        }
    }

    function clearSig() {
        if (sigCtx) sigCtx.clearRect(0, 0, 10000, 10000);
    }

    function closeDetail() {
        document.body.classList.remove('mode-split');
    }

    // --- 8. LIFF初期化 ---
    function initLIFF() {
        if (typeof liff === 'undefined') {
            console.warn("LIFF SDK not loaded");
            return;
        }
        liff.init({ liffId: "2009576392-CvuNETRQ" })
            .then(function() {
                if (!liff.isLoggedIn()) liff.login();
            })
            .catch(function(e) {
                console.error("LIFF Init Error", e);
            });
    }

    // --- 9. DOMContentLoaded でボタン登録 ---
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('btn-boundary').addEventListener('click', function() { selectMode('boundary'); });
        document.getElementById('btn-timber').addEventListener('click', function() { selectMode('timber'); });
        document.getElementById('entry-next-btn').addEventListener('click', verifyCode);
        document.getElementById('btn-back').addEventListener('click', function() { location.reload(); });
        document.getElementById('btn-show-map').addEventListener('click', function() { changeView('map-view'); });
        document.getElementById('btn-to-agree').addEventListener('click', function() { changeView('agree-view'); });
        document.getElementById('btn-close-detail').addEventListener('click', closeDetail);
        document.getElementById('btn-timber-agree').addEventListener('click', function() { changeView('agree-view'); });
        document.getElementById('final-btn').addEventListener('click', finalizeProcess);
        document.getElementById('btn-clear-sig').addEventListener('click', clearSig);

        initLIFF();
    });

})();
</script>
</body>
</html>
