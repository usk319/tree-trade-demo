<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>織杜 ORITO - 森林境界確定合意システム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root { --green: #00B900; --web3: #8247E5; --red: #ff4757; --blue: #007bff; --bg: #f8f9fa; }
        body { margin: 0; font-family: "Hiragino Mincho ProN", serif; background: var(--bg); color: #2d3436; overflow: hidden; height: 100vh; width: 100vw; }
        .view { display: none; height: 100vh; flex-direction: column; overflow: hidden; background: #fff; }
        .view.active { display: flex; }
        
        /* 地図・詳細画面スプリット */
        #map-area { flex: 1; position: relative; width: 100%; transition: flex 0.4s ease; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #detail-area { background: #fff; border-top: 5px solid var(--green); display: none; padding: 20px; overflow-y: auto; height: 60vh; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0,0,0,0.15); z-index: 50; }
        body.mode-split #detail-area { display: block; }
        body.mode-split #map-area { flex: 0.4; }

        /* 写真連動UI */
        .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 15px 0; }
        .photo-item { position: relative; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; border: 3px solid #eee; transition: 0.3s; cursor: pointer; }
        .photo-item.highlight { border-color: var(--blue); transform: scale(1.05); box-shadow: 0 0 15px rgba(0,123,255,0.5); z-index: 10; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .photo-badge { position: absolute; top: 5px; left: 5px; background: var(--blue); color: #fff; font-size: 10px; padding: 2px 8px; border-radius: 4px; z-index: 2; }

        /* UIパーツ */
        .input-field { width: 100%; padding: 16px; border: 1px solid #ddd; border-radius: 12px; margin-bottom: 12px; font-size: 16px; box-sizing: border-box; }
        .btn { width: 100%; padding: 18px; border: none; border-radius: 14px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-primary { background: var(--green); color: white; }

        /* ORITO 演出 */
        #pdf-progress { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); display: none; align-items: center; justify-content: center; z-index: 10000; flex-direction: column; }
        .orito-loader { display: flex; gap: 10px; margin-bottom: 30px; }
        .orito-loader span {
            font-size: 42px; font-weight: 900; color: transparent;
            -webkit-text-stroke: 1px var(--web3);
            animation: orito-glow 2s ease-in-out infinite;
            font-family: serif;
        }
        @keyframes orito-glow {
            0%, 100% { color: transparent; -webkit-text-stroke: 1px #444; transform: translateY(0); }
            50% { color: var(--web3); -webkit-text-stroke: 1px var(--web3); transform: translateY(-10px); text-shadow: 0 0 20px var(--web3); }
        }
        .orito-loader span:nth-child(2) { animation-delay: 0.2s; }
        .orito-loader span:nth-child(3) { animation-delay: 0.4s; }
        .orito-loader span:nth-child(4) { animation-delay: 0.6s; }
        .orito-loader span:nth-child(5) { animation-delay: 0.8s; }
    </style>
</head>
<body>

<div id="pdf-progress">
    <div class="orito-loader"><span>O</span><span>R</span><span>I</span><span>T</span><span>O</span></div>
    <div style="width:200px; height:2px; background:linear-gradient(90deg,transparent,var(--green),transparent); position:relative; overflow:hidden;">
        <div style="position:absolute; width:100%; height:100%; background:#fff; animation: scan 1.5s infinite; left:-100%;"></div>
    </div>
    <p id="progress-text" style="color:var(--web3); font-weight:bold; margin-top:20px; letter-spacing:4px;">PROCESSSING</p>
</div>

<div id="entry-view" class="view active" style="justify-content:center; align-items:center; padding:40px;">
    <h1 style="color:var(--green); font-size:32px;">織杜 ORITO</h1>
    <input type="text" id="invite-input" class="input-field" style="text-align:center; font-size:26px; letter-spacing:6px;" placeholder="CODE001">
    <button class="btn btn-primary" onclick="verifyCode()">調査台帳を開く</button>
</div>

<div id="map-view" class="view">
    <div id="map-area"><div id="map"></div></div>
    <div id="detail-area">
        <h3 id="parcel-title" style="margin:0 0 15px 0;">物件：確認中</h3>
        <div id="photo-list" class="photo-grid"></div>
        <textarea id="owner-msg" class="input-field" placeholder="特記事項があれば入力"></textarea>
        <button class="btn btn-primary" onclick="changeView('agree-view')">最終署名へ</button>
        <button class="btn" style="background:#f1f2f6;" onclick="closeDetail()">✕ 地図を大きく見る</button>
    </div>
</div>

<script>
    const supabaseClient = window.supabase.createClient('https://ndaxoakqggtctatpanvl.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kYXhvYWtxZ2d0Y3RhdHBhbnZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ2Mjc4NzAsImV4cCI6MjA5MDIwMzg3MH0.5cr38JDtnSzdiE3zcaCAUBbxB_K1Df2XiXRqxp8y__c');
    let targetData, mapInstance, pointsGeoJSON;

    async function init() {
        try { await liff.init({ liffId: "2009625158-euVZJmlu" }); } catch(e) {}
    }

    async function verifyCode() {
        const code = document.getElementById('invite-input').value.toUpperCase().trim();
        toggleLoader(true, "認証中...");
        const { data } = await supabaseClient.from('forest_plots').select('*').eq('invitation_code', code).single();
        await new Promise(r => setTimeout(r, 1500)); // ORITO演出用
        toggleLoader(false);

        if (!data) return alert("無効なコードです");
        targetData = data;
        changeView('map-view');
    }

    function initMap() {
        if (mapInstance) return;
        mapInstance = new maplibregl.Map({
            container: 'map',
            style: { "version": 8, "sources": { "gsi": { "type": "raster", "tiles": ["https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg"], "tileSize": 256 } }, "layers": [{ "id": "gsi", "type": "raster", "source": "gsi" }] },
            center: [131.39, 31.99], zoom: 17, preserveDrawingBuffer: true
        });

        mapInstance.on('load', async () => {
            const { data } = await supabaseClient.rpc('get_forest_geojson');
            const filtered = data.features.filter(f => f.properties.invitation_code === targetData.invitation_code);
            
            // ポリゴン追加
            mapInstance.addSource('plot-src', { 'type': 'geojson', 'data': { type: "FeatureCollection", features: filtered } });
            mapInstance.addLayer({ 'id': 'fill', 'type': 'fill', 'source': 'plot-src', 'paint': { 'fill-opacity': 0.3, 'fill-color': '#00B900' } });

            // 杭（ポイント）追加
            const photos = getUrls(targetData.evidence_photo_url);
            let coords = filtered[0].geometry.type === 'MultiPolygon' ? filtered[0].geometry.coordinates[0][0] : filtered[0].geometry.coordinates[0];
            const pts = photos.map((u, i) => ({
                "type": "Feature", "geometry": { "type": "Point", "coordinates": coords[Math.floor((i / photos.length) * (coords.length - 1))] },
                "properties": { "idx": (i + 1).toString() }
            }));
            pointsGeoJSON = { "type": "FeatureCollection", "features": pts };
            
            mapInstance.addSource('pts-src', { 'type': 'geojson', 'data': pointsGeoJSON });
            mapInstance.addLayer({ 'id': 'pts-c', 'type': 'circle', 'source': 'pts-src', 'paint': { 'circle-radius': 15, 'circle-color': '#007bff', 'circle-stroke-width': 3, 'circle-stroke-color': '#fff' } });
            mapInstance.addLayer({ 'id': 'pts-l', 'type': 'symbol', 'source': 'pts-src', 'layout': { 'text-field': ['get', 'idx'], 'text-size': 12 }, 'paint': { 'text-color': '#fff' } });

            const bounds = new maplibregl.LngLatBounds(); coords.forEach(c => bounds.extend(c)); mapInstance.fitBounds(bounds, { padding: 60 });

            // --- タップ挙動の統一 ---
            
            // 1. ポリゴンをタップ -> 詳細パネルを開く
            mapInstance.on('click', 'fill', () => showDetail());

            // 2. 杭をタップ -> 詳細を開き、該当写真へスクロール
            mapInstance.on('click', 'pts-c', (e) => {
                const idx = e.features[0].properties.idx;
                highlightInList(idx);
            });
        });
    }

    function showDetail() {
        if(document.body.classList.contains('mode-split')) return;
        document.getElementById('parcel-title').innerText = "物件地番：" + targetData.parcel_number;
        document.getElementById('photo-list').innerHTML = getUrls(targetData.evidence_photo_url).map((u, i) => `
            <div class="photo-item" id="photo-${i+1}" onclick="focusOnMap(${i+1})">
                <span class="photo-badge">杭No.${i+1}</span>
                <img src="${u}">
            </div>`).join('');
        document.body.classList.add('mode-split');
        setTimeout(() => mapInstance.resize(), 300);
    }

    // 杭タップ -> 写真リスト強調
    function highlightInList(idx) {
        showDetail();
        setTimeout(() => {
            document.querySelectorAll('.photo-item').forEach(el => el.classList.remove('highlight'));
            const target = document.getElementById(`photo-${idx}`);
            if (target) {
                target.classList.add('highlight');
                target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }, 500);
    }

    // 写真タップ -> 地図の杭へジャンプ
    function focusOnMap(idx) {
        const feature = pointsGeoJSON.features[idx-1];
        if (feature) {
            mapInstance.flyTo({ center: feature.geometry.coordinates, zoom: 19, speed: 1.2 });
            // 地図上の杭を光らせる（簡易）
            document.querySelectorAll('.photo-item').forEach(el => el.classList.remove('highlight'));
            document.getElementById(`photo-${idx}`).classList.add('highlight');
        }
    }

    function toggleLoader(show, text = "") {
        document.getElementById('progress-text').innerText = text;
        document.getElementById('pdf-progress').style.display = show ? 'flex' : 'none';
    }

    function getUrls(d) { if (!d) return []; const m = String(d).match(/https?:\/\/[^\s,"{}]+/g); return m ? m.map(u => u.replace(/[\]\}\s,]+$/, '')) : []; }
    function changeView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id === 'map-view') setTimeout(initMap, 300);
    }
    function closeDetail() { document.body.classList.remove('mode-split'); setTimeout(() => mapInstance.resize(), 300); }

    init();
</script>
</body>
</html>
