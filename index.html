<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <title>織杜 ORITO | 森林境界・立木取引統合システム</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --primary: #00B900;
            --primary-dark: #008a00;
            --accent-red: #ff4757;
            --nothing-black: #111111;
            --nothing-gray: #f5f5f7;
            --glass: rgba(255, 255, 255, 0.9);
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
            --font-main: "Hiragino Mincho ProN", serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: var(--font-main); background: var(--nothing-gray); color: var(--nothing-black); overflow: hidden; height: 100vh; width: 100vw; }
        
        .view { display: none; height: 100vh; flex-direction: column; background: #fff; overflow: hidden; }
        .view.active { display: flex !important; }

        .input-field { width: 100%; padding: 18px; border: 2px solid #eee; border-radius: 16px; margin-bottom: 14px; font-size: 16px; font-family: inherit; }
        .btn { width: 100%; padding: 20px; border: none; border-radius: 18px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; font-family: inherit; transition: 0.2s; }
        .btn-primary { background: var(--nothing-black); color: #fff; }
        .btn-web3 { background: linear-gradient(135deg, #00B900, #006600); color: #fff; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        /* ホーム */
        #home-view { padding: 40px 24px; justify-content: space-between; }
        .brand-section { text-align: center; margin-top: 40px; }
        .brand-name { font-size: 32px; font-weight: 900; letter-spacing: 6px; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 40px; }
        .menu-card { background: var(--nothing-gray); border-radius: 24px; padding: 24px 16px; text-align: center; border: none; }

        /* 地図 */
        #map-area { flex: 1; position: relative; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        #detail-area {
            background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            position: absolute; bottom: 0; width: 100%; height: 55vh; border-radius: 32px 32px 0 0;
            display: none; flex-direction: column; z-index: 100; box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
        }
        body.mode-split #detail-area { display: flex; }

        .ai-card { background: #fff; border-radius: 20px; padding: 20px; margin-bottom: 12px; border: 1px solid #eee; }
        .ai-value { font-family: var(--font-mono); font-size: 24px; font-weight: bold; color: var(--primary); }
        .tech-tag { font-family: var(--font-mono); font-size: 10px; background: var(--nothing-black); color: #fff; padding: 2px 6px; border-radius: 4px; display: inline-block; }

        /* ローダー */
        #forest-loader { position: fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:10000; display:none; flex-direction:column; align-items:center; justify-content:center; }
        
        /* 署名キャンバス */
        .sig-box { border: 2px solid #eee; border-radius: 20px; background: #fafafa; width: 100%; height: 250px; touch-action: none; }
    </style>
</head>
<body>

<div id="forest-loader">
    <div style="font-size: 40px;">🌲</div>
    <div id="loader-msg" style="font-family:var(--font-mono); margin-top:10px;">LOADING...</div>
</div>

<div id="home-view" class="view active">
    <div class="brand-section">
        <span style="font-size: 50px;">🌳</span>
        <h1 class="brand-name">ORITO</h1>
        <p style="color:#999; font-family:var(--font-mono); font-size:12px;">FOREST MANAGEMENT SYSTEM</p>
    </div>
    <div class="menu-grid">
        <button class="menu-card" onclick="startApp('boundary')">📍<br>境界確定</button>
        <button class="menu-card" onclick="startApp('timber')">🪵<br>立木売買</button>
        <button class="menu-card" style="grid-column: span 2;" onclick="startApp('view')">🔍<br>森林レポート閲覧</button>
    </div>
</div>

<div id="entry-view" class="view">
    <div style="padding: 40px 24px; flex: 1; display: flex; flex-direction: column; justify-content: center;">
        <h2 style="text-align: center;">アクセスコード入力</h2>
        <input type="text" id="invite-input" class="input-field" style="text-align: center; font-size: 24px;" placeholder="CODE001">
        <button class="btn btn-primary" onclick="verifyAccess()">認証・照会</button>
        <button class="btn" style="color:#999;" onclick="showView('home-view')">戻る</button>
    </div>
</div>

<div id="map-view" class="view">
    <div id="map-area"><div id="map"></div></div>
    <div id="detail-area">
        <div style="padding: 24px; overflow-y: auto;">
            <div id="status-badge"></div>
            <h2 id="parcel-title" style="margin: 8px 0;">---</h2>
            <div id="detail-content"></div>
            <div id="action-buttons"></div>
            <button class="btn" style="margin-top:20px; color:#ccc;" onclick="document.body.classList.remove('mode-split')">閉じる</button>
        </div>
    </div>
</div>

<div id="report-view" class="view">
    <div style="padding: 20px; border-bottom: 1px solid #eee; display: flex; align-items: center;">
        <button onclick="showView('map-view')" style="border:none; background:none; font-size:20px;">←</button>
        <b style="margin-left: 10px;">森林資産評価レポート</b>
    </div>
    <div id="report-content" style="flex: 1; overflow-y: auto; padding: 24px;">
        </div>
    <div style="padding: 20px;">
        <button class="btn btn-primary" id="btn-generate-pdf" onclick="generatePDF()">PDFを発行する</button>
    </div>
</div>

<div id="agree-view" class="view">
    <div style="padding: 24px;">
        <h2>デジタル署名</h2>
        <p style="font-size: 14px; color: #666;">内容を確認の上、枠内に署名してください。</p>
        <canvas id="sig-canvas" class="sig-box"></canvas>
        <button class="btn btn-web3" style="margin-top:20px;" onclick="saveSignature()">署名を完了する</button>
        <button class="btn" onclick="showView('map-view')">キャンセル</button>
    </div>
</div>

<script>
    const S_URL = 'https://uggpclqqyaailuadgzxv.supabase.co';
    const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVnZ3BjbHFxeWFhaWx1YWRnenh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1MzE0NTgsImV4cCI6MjA5MDEwNzQ1OH0.jY5jJuJUgwbIZm8y-jJvEH27eAP9m9semR3MbLxVxGo';
    const db = window.supabase.createClient(S_URL, S_KEY);

    let state = { mode: '', targetData: null, map: null, accessLevel: 0 };

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if (id === 'map-view') {
            setTimeout(() => { if(state.map) state.map.resize(); }, 100);
        }
    }

    function toggleLoader(show, msg = 'LOADING...') {
        const l = document.getElementById('forest-loader');
        document.getElementById('loader-msg').innerText = msg;
        l.style.display = show ? 'flex' : 'none';
    }

    function startApp(mode) {
        state.mode = mode;
        showView('entry-view');
    }

    async function verifyAccess() {
        const code = document.getElementById('invite-input').value.trim();
        toggleLoader(true, 'AUTHENTICATING...');
        
        try {
            const { data, error } = await db.from('forest_plots').select('*')
                .or(`invitation_code.eq.${code},adjacent_code.eq.${code}`).maybeSingle();

            if (error || !data) {
                alert('有効なコードが見つかりません。');
                toggleLoader(false);
                return;
            }

            state.targetData = data;
            state.accessLevel = (data.invitation_code === code) ? 3 : 2;
            
            toggleLoader(false);
            showView('map-view');
            initMap();
        } catch (e) {
            alert('通信エラーが発生しました。');
            toggleLoader(false);
        }
    }

    function initMap() {
        if (state.map) {
            updateMapLayer();
            return;
        }

        state.map = new maplibregl.Map({
            container: 'map',
            // ズーム制限を追加 (国土地理院写真の上限に合わせる)
            maxZoom: 18,
            style: {
                version: 8,
                sources: {
                    gsi: {
                        type: 'raster',
                        tiles: ['https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg'],
                        tileSize: 256,
                        attribution: "地理院タイル"
                    }
                },
                layers: [{ id: 'gsi', type: 'raster', source: 'gsi' }]
            },
            center: [131.39, 31.99],
            zoom: 15
        });

        state.map.on('load', updateMapLayer);
    }

    async function updateMapLayer() {
        const { data } = await db.rpc('get_forest_geojson');
        if (!data) return;

        const filtered = data.features.filter(f => f.properties.id === state.targetData.id);
        
        if (state.map.getSource('plots')) {
            state.map.getSource('plots').setData({ type: 'FeatureCollection', features: filtered });
        } else {
            state.map.addSource('plots', { type: 'geojson', data: { type: 'FeatureCollection', features: filtered } });
            state.map.addLayer({
                id: 'fill', type: 'fill', source: 'plots',
                paint: { 'fill-color': '#00B900', 'fill-opacity': 0.5 }
            });
            state.map.addLayer({
                id: 'line', type: 'line', source: 'plots',
                paint: { 'line-color': '#fff', 'line-width': 2 }
            });
        }

        const bounds = new maplibregl.LngLatBounds();
        filtered[0].geometry.coordinates[0][0].forEach(c => bounds.extend(c));
        // fitBoundsでもmaxZoomが効くように設定
        state.map.fitBounds(bounds, { padding: 50, maxZoom: 17 });
        
        showDetail();
    }

    function showDetail() {
        const d = state.targetData;
        document.body.classList.add('mode-split');
        document.getElementById('parcel-title').innerText = d.parcel_number;
        document.getElementById('status-badge').innerHTML = d.is_agreed 
            ? '<span class="tech-tag" style="background:var(--primary)">合意済み</span>' 
            : '<span class="tech-tag" style="background:var(--accent-red)">未合意</span>';

        const content = document.getElementById('detail-content');
        content.innerHTML = `
            <div class="ai-card">
                <div class="tech-tag">ASSET DATA</div>
                <div style="font-size:14px; margin-top:10px;">面積: ${d.area_ha} ha</div>
                <div style="font-size:14px;">推定炭素固定量: ${(d.area_ha * 8.5).toFixed(1)} t-CO2/年</div>
            </div>
        `;

        const actions = document.getElementById('action-buttons');
        actions.innerHTML = '';
        
        const btnReport = document.createElement('button');
        btnReport.className = 'btn btn-primary';
        btnReport.innerText = '資産レポートを表示';
        btnReport.onclick = renderReport;
        actions.appendChild(btnReport);

        if (!d.is_agreed) {
            const btnSign = document.createElement('button');
            btnSign.className = 'btn btn-web3';
            btnSign.innerText = 'デジタル署名を行う';
            btnSign.onclick = () => { showView('agree-view'); initSignature(); };
            actions.appendChild(btnSign);
        }
    }

    function renderReport() {
        const d = state.targetData;
        const totalValue = Math.round(d.area_ha * 1500000);
        const reportDiv = document.getElementById('report-content');
        
        reportDiv.innerHTML = `
            <div style="border: 2px solid #000; padding: 20px; border-radius:10px;">
                <h1 style="text-align:center; font-size:20px;">森林資産評価証明書</h1>
                <hr>
                <div style="margin:20px 0;">
                    <p><b>対象地番:</b> ${d.parcel_number}</p>
                    <p><b>公簿面積:</b> ${d.area_ha} ha</p>
                    <p><b>評価基準日:</b> ${new Date().toLocaleDateString()}</p>
                </div>
                <div class="ai-card" style="text-align:center;">
                    <p style="font-size:12px; color:#666;">推定資産価値合計</p>
                    <div class="ai-value">¥${totalValue.toLocaleString()}</div>
                </div>
                <div style="font-size:12px; color:#888; margin-top:20px;">
                    本レポートは「織杜 (ORITO)」の森林解析アルゴリズムに基づき算出された参考値です。<br>
                    J-クレジット創出可能性: <b>高 (Sランク)</b>
                </div>
            </div>
        `;
        
        // 署名が終わっていなくてもテスト用にPDF発行は可能にしておきます
        document.getElementById('btn-generate-pdf').disabled = false;
        showView('report-view');
    }

    // --- PDF生成機能 ---
    function generatePDF() {
        const element = document.getElementById('report-content');
        const opt = {
            margin:       10,
            filename:     `Report_${state.targetData.parcel_number}.pdf`,
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2 },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        
        toggleLoader(true, 'GENERATING PDF...');
        html2pdf().set(opt).from(element).save().then(() => {
            toggleLoader(false);
        });
    }

    // --- 署名機能 ---
    let sigCtx, drawing = false;
    function initSignature() {
        const canvas = document.getElementById('sig-canvas');
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        sigCtx = canvas.getContext('2d');
        sigCtx.lineWidth = 3;
        sigCtx.lineCap = 'round';

        const getPos = (e) => {
            const r = canvas.getBoundingClientRect();
            const t = e.touches ? e.touches[0] : e;
            return { x: t.clientX - r.left, y: t.clientY - r.top };
        };
        canvas.onmousedown = canvas.ontouchstart = (e) => { 
            drawing = true; const p = getPos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x, p.y); 
        };
        canvas.onmousemove = canvas.ontouchmove = (e) => {
            if(!drawing) return; const p = getPos(e); sigCtx.lineTo(p.x, p.y); sigCtx.stroke(); e.preventDefault();
        };
        window.onmouseup = window.ontouchend = () => drawing = false;
    }

    async function saveSignature() {
        toggleLoader(true, 'SAVING...');
        const dataUrl = document.getElementById('sig-canvas').toDataURL();
        
        const updates = { is_agreed: true, sig_b_data: dataUrl, sig_b_done: true };
        const { error } = await db.from('forest_plots').update(updates).eq('id', state.targetData.id);
        
        if (error) {
            alert('保存に失敗しました。');
        } else {
            alert('署名が完了しました。');
            location.reload();
        }
        toggleLoader(false);
    }

    // LIFF初期化
    liff.init({ liffId: '2009625158-euVZJmlu' }).catch(console.error);
</script>

</body>
</html>
